    operator: equals
    value: 0
- id: obs-audit-violations
  kind: state.value
  packageId: shop
  namespace: observations
  rowId: final
  path:
  - audit_violations
  comparison:
    operator: equals
    value: 0
- id: obs-searches
  kind: state.value
  packageId: shop
  namespace: observations
  rowId: final
  path:
  - searches
  comparison:
    operator: equals
    value: 2
- id: obs-last-within-35
  kind: state.value
  packageId: shop
  namespace: observations
  rowId: final
  path:
  - last_within_35
  comparison:
    operator: equals
    value: true
