schemaVersion: 1
id: same-search-no-rescrape
title: A lower budget reuses the scrape
tags:
- mealmatch
targetId: mealmatch
scenarioId: baseline
actorId: shopper-agent
task:
  instruction: A lower budget reuses the scrape
  input:
    turns:
    - Find me spicy Chinese food for two under $40. I prefer noodles. I do not like
      mushrooms. I want the cheapest option that arrives within 40 minutes.
    - none of these, actually under $35
    faults: {}
