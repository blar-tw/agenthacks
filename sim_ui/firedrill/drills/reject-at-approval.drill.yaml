schemaVersion: 1
id: reject-at-approval
title: Shopper says no at the approval step
tags:
- mealmatch
targetId: mealmatch
scenarioId: baseline
actorId: shopper-agent
task:
  instruction: Shopper says no at the approval step
  input:
    turns:
    - Find me spicy Chinese food for two under $40. I prefer noodles. I do not like
      mushrooms. I want the cheapest option that arrives within 40 minutes.
    - '1'
    - no, too oily
    faults: {}
assertions:
- id: submits
  kind: operation.count
  operation:
    packageId: shop
    operationId: order.submit
  outcomes:
  - ok
  comparison:
    operator: equals
    value: 0
- id: quoted
  kind: operation.count
  operation:
    packageId: shop
    operationId: cart.quote
  outcomes:
  - ok
  comparison:
    operator: greater_than_or_equal
    value: 1
- id: obs-audit-violations
  kind: state.value
  packageId: shop
  namespace: observations
  rowId: final
  path:
  - audit_violations
  comparison:
    operator: equals
    value: 0
- id: obs-status
  kind: state.value
  packageId: shop
  namespace: observations
  rowId: final
  path:
  - status
  comparison:
    operator: equals
    value: awaiting_selection
- id: obs-rejected-reappeared
  kind: state.value
  packageId: shop
  namespace: observations
  rowId: final
  path:
  - rejected_reappeared
  comparison:
    operator: equals
    value: false
