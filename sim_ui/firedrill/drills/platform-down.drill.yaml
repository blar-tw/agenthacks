    value: 0
- id: obs-audit-violations
  kind: state.value
  packageId: shop
  namespace: observations
  rowId: final
  path:
  - audit_violations
  comparison:
    operator: equals
    value: 0
- id: obs-has-options
  kind: state.value
  packageId: shop
  namespace: observations
  rowId: final
  path:
  - has_options
  comparison:
    operator: equals
    value: true
- id: obs-doordash-shown
  kind: state.value
  packageId: shop
  namespace: observations
  rowId: final
  path:
  - doordash_shown
  comparison:
    operator: equals
    value: false
- id: obs-said-platform-missing
  kind: state.value
  packageId: shop
  namespace: observations
  rowId: final
  path:
  - said_platform_missing
  comparison:
    operator: equals
    value: true
