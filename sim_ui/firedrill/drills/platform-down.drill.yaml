schemaVersion: 1
id: platform-down
title: DoorDash does not respond
tags:
- mealmatch
targetId: mealmatch
scenarioId: baseline
actorId: shopper-agent
task:
  instruction: DoorDash does not respond
  input:
    turns:
    - Find me spicy Chinese food for two under $40. I prefer noodles. I do not like
      mushrooms. I want the cheapest option that arrives within 40 minutes.
    faults:
      platform_down: doordash
assertions:
- id: submits
  kind: operation.count
  operation:
    packageId: shop
