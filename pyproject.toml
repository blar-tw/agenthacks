[project]
name = "mealmatch"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "apify-client>=3.5.1",
    "fastapi>=0.165.0",
    "firedrill-run>=1.0.1",
    "httpx>=0.28.1",
    "langchain-openai>=1.8.5",
    "langgraph>=1.2.24",
    "pydantic>=2.14.4",
    "pymysql>=1.2.4",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
    "statsig>=0.72.1",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
memory = [
    "cognee>=1.6.10",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
