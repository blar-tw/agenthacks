[project]
name = "mealmatch"
version = "0.1.0"
description = "Personal food-ordering agent with an audit trail"
requires-python = ">=3.12"
dependencies = [
    "apify-client>=3.5.1",
    "httpx>=0.28.1",
    "pydantic>=2.14.4",
    "pymysql>=1.2.4",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
]

[project.optional-dependencies]
memory = [
    "cognee>=1.6.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
